/* =====================================================
   SWISS ENGINE
   ===================================================== */
function createSwiss(items){
  const players = items.map(item=>({
    ...item, wins:0, losses:0, draws:0, score:0, opponents:[], buchholz:0
  }));
  const totalRounds = Math.max(Math.ceil(Math.log2(players.length))*2, 3);
  const totalBattles = Math.floor(players.length/2) * totalRounds;
  return {players, totalRounds, totalBattles, currentRound:1, pairs:[], pairIdx:0, done:false};
}

function swissPair(state){
  const sorted = [...state.players].sort((a,b)=>
    b.score!==a.score ? b.score-a.score :
    b.buchholz!==a.buchholz ? b.buchholz-a.buchholz : Math.random()-0.5
  );
  const paired=new Set(), pairs=[];
  for(let i=0;i<sorted.length;i++){
    if(paired.has(sorted[i].id)) continue;
    let found=false;
    for(let j=i+1;j<sorted.length;j++){
      if(paired.has(sorted[j].id)) continue;
      if(!sorted[i].opponents.includes(sorted[j].id)){
        pairs.push([sorted[i],sorted[j]]);
        paired.add(sorted[i].id); paired.add(sorted[j].id);
        found=true; break;
      }
    }
    if(!found){
      for(let j=i+1;j<sorted.length;j++){
        if(!paired.has(sorted[j].id)){
          pairs.push([sorted[i],sorted[j]]);
          paired.add(sorted[i].id); paired.add(sorted[j].id);
          break;
        }
      }
    }
  }
  return pairs;
}

function swissApply(state, winnerId, loserId, isDraw){
  const w=state.players.find(p=>p.id===winnerId);
  const l=state.players.find(p=>p.id===loserId);
  if(!w||!l) return;
  if(isDraw){ w.draws++; w.score+=1; l.draws++; l.score+=1; }
  else { w.wins++; w.score+=2; l.losses++; }
  if(!w.opponents.includes(l.id)) w.opponents.push(l.id);
  if(!l.opponents.includes(w.id)) l.opponents.push(w.id);
  state.players.forEach(p=>{
    p.buchholz=p.opponents.reduce((s,oid)=>{
      const o=state.players.find(x=>x.id===oid); return s+(o?o.score:0);
    },0);
  });
}

function swissRanking(state){
  return [...state.players].sort((a,b)=>
    b.score!==a.score?b.score-a.score:
    b.buchholz!==a.buchholz?b.buchholz-a.buchholz:
    b.wins!==a.wins?b.wins-a.wins:0
  );
}

function swissNextPair(state){
  if(state.pairIdx>=state.pairs.length){
    state.currentRound++;
    if(state.currentRound>state.totalRounds){state.done=true;return false;}
    state.pairs=swissPair(state); state.pairIdx=0;
    if(state.pairs.length===0){state.done=true;return false;}
  }
  return true;
}

/* ── Progress bar ── */
function progressBar(state){
  const done=(state.currentRound-1)*Math.floor(state.players.length/2)+state.pairIdx;
  const pct=Math.min(Math.round((done/state.totalBattles)*100),99);
  return `
    <div class="card p-4 mb-5">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
          ${tr('round')} ${state.currentRound} ${tr('of')} ${state.totalRounds}
        </span>
        <span class="text-xs font-bold text-primary">${pct}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>`;
}

}

        <td class="px-2 py-2 w-20">

        <table class="w-full border-collapse">

      <div class="flex gap-3 justify-center">

/* =====================================================
   SONG SORTER
   ===================================================== */
let SS = null;

function songSorterPage(){
  SS=null;
  document.getElementById('app').innerHTML=`
    <div class="card p-8 max-w-md mx-auto text-center">
      <div class="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center mx-auto mb-4 text-3xl">🎵</div>
      <h2 class="text-xl font-extrabold text-gray-800 mb-1">${tr('song')}</h2>
      <p class="text-gray-400 text-sm mb-1 font-medium">Swiss System · ${songs.length} ${tr('songLabel')}</p>
      <p class="text-gray-400 text-xs mb-7">
        ${lang==='jp'?'各バトルでSpotifyプレビューを聴きながら選ぼう！':
          lang==='id'?'Dengarkan preview Spotify di setiap battle!':
          'Listen to Spotify previews during each battle!'}
      </p>
      <button onclick="startSongSorter()" class="btn-primary text-base">${tr('start')} 🎶</button>
    </div>`;
}

function startSongSorter(){
  SS=createSwiss(songs); SS.pairs=swissPair(SS); renderSongBattle();
}

function renderSongBattle(){
  if(!swissNextPair(SS)){renderSongResult();return;}
  const [a,b]=SS.pairs[SS.pairIdx];
  document.getElementById('app').innerHTML=`
    <div class="max-w-2xl mx-auto">
      ${progressBar(SS)}
      <p class="text-center text-gray-500 font-semibold text-sm mb-4 tracking-wide uppercase">${tr('chooseSong')}</p>
      <div class="space-y-3 mb-4">
        ${[a,b].map((s,idx)=>{
          const other=idx===0?b:a;
          return `
            <div class="song-card">
              <div class="flex items-center justify-between mb-3 gap-3">
                <div class="min-w-0">
                  <div class="font-bold text-gray-800 text-sm leading-snug">${s.title}</div>
                </div>
                <button onclick="songVote(${s.id},${other.id},false)"
                  class="btn-primary flex-shrink-0 text-sm py-2 px-4">
                  ✓ ${tr('pick')}
                </button>
              </div>
              <iframe src="https://open.spotify.com/embed/track/${s.spotifyId}?utm_source=generator&theme=0"
                width="100%" height="80" frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy" class="spotify-frame"></iframe>
            </div>`;
        }).join('')}
      </div>
      <div class="text-center">
        <button onclick="songVote(${a.id},${b.id},true)" class="btn-secondary text-sm">
          🤝 ${tr('draw')}
        </button>
      </div>
    </div>`;
}

function songVote(winnerId,loserId,isDraw){
  const [a,b]=SS.pairs[SS.pairIdx];
  swissApply(SS,isDraw?a.id:winnerId,isDraw?b.id:loserId,isDraw);
  SS.pairIdx++; renderSongBattle();
}

function renderSongResult(){
  const ranked=swissRanking(SS);
  const rows=ranked.map((s,i)=>{
    const r=i+1;
    const isTop=r<=3;
    return `
      <tr class="rank-row ${isTop?'top':''} ${accentClass(r)}">
        <td class="px-4 py-3 w-14">
          <div class="flex justify-center">${rankBadge(r)}</div>
        </td>
        <td class="px-3 py-3">
          <div class="font-bold text-gray-800 text-sm">${s.title}</div>
          ${isTop?`<div class="text-xs text-gray-400 mt-0.5">${r===1?'🥇 No. 1':r===2?'🥈 No. 2':'🥉 No. 3'}</div>`:''}
        </td>
      </tr>`;
  }).join('');

  document.getElementById('app').innerHTML=`
    <div class="max-w-xl mx-auto">
      <div class="text-center mb-5">
        <h2 class="text-2xl font-extrabold text-gray-800">🎵 ${tr('result')}</h2>
        <p class="text-gray-400 text-sm font-medium">${tr('song')} · Swiss System</p>
      </div>

      <!-- Top 3 Spotify -->
      <div class="card p-5 mb-5">
        <div class="flex items-center gap-2 mb-4">
          <span class="text-lg">🏆</span>
          <span class="font-bold text-gray-700 text-sm">${tr('top3')}</span>
        </div>
        <div class="space-y-3">
          ${ranked.slice(0,3).map((s,i)=>`
            <div>
              <div class="flex items-center gap-2 mb-1.5">
                ${rankBadge(i+1)}
                <span class="text-xs font-bold text-gray-600">${s.title}</span>
              </div>
              <iframe src="https://open.spotify.com/embed/track/${s.spotifyId}?utm_source=generator&theme=0"
                width="100%" height="80" frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy" class="spotify-frame"></iframe>
            </div>`).join('')}
        </div>
      </div>

      <!-- Full table -->
      <div id="songResultTable" class="card overflow-hidden mb-5">
        <div class="bg-gradient-to-r from-primary to-primaryDark px-4 py-3">
          <span class="text-white font-bold text-sm tracking-wide">${tr('rank')} · ${tr('songTitle')}</span>
        </div>
        <table class="w-full border-collapse">
          <tbody>${rows}</tbody>
        </table>
      </div>

      <div class="flex gap-3 justify-center">
        <button onclick="dlTable('songResultTable','song-ranking')" class="btn-primary">⬇ ${tr('download')}</button>
        <button onclick="songSorterPage()" class="btn-secondary">🔄 ${tr('reset')}</button>
      </div>
    </div>`;
}

/* =====================================================
   DOWNLOAD
   ===================================================== */
function dlTable(id,filename){
  const el=document.getElementById(id);
  if(!el) return;
  html2canvas(el,{useCORS:true,backgroundColor:'#ffffff',scale:2}).then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download=filename+'.png'; a.click();
  });
}

/* =====================================================
   SENBATSU
   ===================================================== */
let formation=[], senbatsuCount=7, activeSlot=null;

function senbatsu(){
  document.getElementById('app').innerHTML=`
    <div class="card p-5">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xl">⭐</span>
        <h2 class="text-lg font-extrabold text-gray-800">${tr('senbatsu')}</h2>
      </div>
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">
        ${tr('chooseCount')} (3–17)
      </label>
      <input type="number" min="3" max="17" value="${senbatsuCount}"
        onchange="senbatsuCount=parseInt(this.value);generateFormation()"
        class="input-base mb-4" style="max-width:120px">
      <div class="flex gap-2 mb-4">
        <button onclick="autoFill()" class="btn-primary text-sm py-2">${tr('autoFill')}</button>
        <button onclick="clearFormation()" class="btn-secondary text-sm py-2">Clear</button>
      </div>
      <div id="stage" class="stage-bg space-y-1"></div>
      <div class="mt-4 text-center">
        <button onclick="downloadStage()" class="btn-primary">⬇ ${tr('download')}</button>
      </div>
    </div>`;
  generateFormation();
}

function generateFormation(){
  formation=[];
  let n=parseInt(senbatsuCount);
  if(isNaN(n)||n<3) n=3;
  if(n>17) n=17;
  const presets={
    3:[[3]],4:[[4]],5:[[5]],
    6:[[3],[3]],7:[[4],[3]],8:[[5],[3]],9:[[5],[4]],10:[[6],[4]],
    11:[[4],[4],[3]],12:[[5],[4],[3]],13:[[5],[5],[3]],
    14:[[6],[5],[3]],15:[[6],[6],[3]],16:[[7],[6],[3]],17:[[7],[7],[3]],
  };
  const rows=presets[n]||[[n]];
  formation=rows.map(r=>Array(r[0]).fill(null));
  renderStage();
}

function renderStage(){
  const stage=document.getElementById('stage');
  if(!stage) return;
  stage.innerHTML='';
  const isFrontRow=ri=>ri===formation.length-1;
  formation.forEach((row,ri)=>{
    const div=document.createElement('div');
    div.className='flex justify-center gap-1';
    row.forEach((slot,ci)=>{
      const box=document.createElement('div');
      const isFront=isFrontRow(ri);
      const len=row.length;
      const isCenter=isFront&&(len%2===1?ci===Math.floor(len/2):ci===len/2-1||ci===len/2);
      box.className=`w-20 h-20 bg-white/10 rounded-lg flex items-center justify-center
                     cursor-pointer text-white hover:bg-white/20 transition flex-shrink-0
                     ${isCenter&&slot?'center-glow':''}`;
      box.onclick=()=>selectMember(ri,ci);
      if(slot){
        box.innerHTML=`
          <div class="relative w-full h-full">
            <img src="${slot.img}" class="w-full h-full object-cover rounded-lg">
            <div class="absolute bottom-0 left-0 right-0 bg-black/50 text-white
                        text-center py-0.5 rounded-b-lg truncate px-1"
                 style="font-size:10px">${slot.name[lang]}</div>
          </div>`;
      } else {
        box.innerHTML=`<span class="text-2xl opacity-30">+</span>`;
      }
      div.appendChild(box);
    });
    stage.appendChild(div);
  });
}

function selectMember(r,c){activeSlot={row:r,col:c};openModal();}

function openModal(){
  const mm=document.getElementById('memberModal');
  const mg=document.getElementById('memberGrid');
  mm.classList.remove('hidden'); mm.classList.add('flex');
  mg.innerHTML='';
  members.forEach(m=>{
    const used=formation.some(row=>row.some(s=>s?.id===m.id));
    const div=document.createElement('div');
    div.className=`text-center cursor-pointer ${used?'opacity-40 pointer-events-none':'hover:scale-105 transition'}`;
    div.innerHTML=`
      <img src="${m.img}" class="w-full aspect-square object-cover rounded-lg border-2
           ${used?'border-gray-200':'border-primary/50'}">
      <div class="text-xs mt-1 font-medium text-gray-700 truncate">${m.name[lang]}</div>`;
    if(!used) div.onclick=()=>selectFromModal(m.id);
    mg.appendChild(div);
  });
}

function closeModal(){
  const mm=document.getElementById('memberModal');
  mm.classList.add('hidden'); mm.classList.remove('flex');
}

function selectFromModal(id){
  const m=members.find(x=>x.id===id);
  if(!m||!activeSlot) return;
  formation[activeSlot.row][activeSlot.col]=m;
  closeModal(); renderStage();
}

function clearFormation(){formation=formation.map(r=>r.map(()=>null));renderStage();}

function autoFill(){
  const shuffled=[...members].sort(()=>Math.random()-0.5);
  let i=0;
  formation=formation.map(r=>r.map(()=>shuffled[i++]||null));
  renderStage();
}

function downloadStage(){
  const stage=document.getElementById('stage');
  if(!stage) return;
  html2canvas(stage,{useCORS:true,backgroundColor:'#0b1a23'}).then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download='dream-senbatsu.png'; a.click();
  });
}
