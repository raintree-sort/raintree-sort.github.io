<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Tree Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config={theme:{extend:{
    colors:{primary:'#2ec4c6', primaryDark:'#1fa8aa', primaryLight:'#e6fafa'},
    fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}
  }}}
</script>
<style>
  *{font-family:'Plus Jakarta Sans',sans-serif;}

  /* ── Header ── */
  .header-bg{
    background:linear-gradient(135deg,#1a9ea0 0%,#2ec4c6 50%,#4dd9db 100%);
    position:relative;overflow:hidden;
  }
  .header-bg::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at top right,rgba(255,255,255,0.15),transparent 60%);
    pointer-events:none;
  }

  /* ── Nav ── */
  .nav-wrap{
    background:#fff;
    border-bottom:1px solid #e8f8f8;
    box-shadow:0 2px 12px rgba(46,196,198,0.08);
  }
  .nav-btn{
    padding:8px 18px;border-radius:999px;font-weight:600;font-size:0.82rem;
    color:#6b7280;letter-spacing:0.01em;transition:all .2s;
  }
  .nav-btn:hover{background:#e6fafa;color:#1fa8aa;}
  .nav-btn.active{
    background:linear-gradient(135deg,#2ec4c6,#1fa8aa);
    color:#fff;box-shadow:0 2px 10px rgba(46,196,198,0.35);
  }

  /* ── Card base ── */
  .card{background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,0.07);}
  .card-hover{transition:transform .18s,box-shadow .18s;}
  .card-hover:hover{transform:translateY(-5px);box-shadow:0 8px 28px rgba(46,196,198,0.2);}

  /* ── Buttons ── */
  .btn-primary{
    background:linear-gradient(135deg,#2ec4c6,#1a9ea0);
    color:#fff;font-weight:700;border-radius:12px;
    padding:10px 24px;transition:all .2s;letter-spacing:0.01em;
    box-shadow:0 2px 12px rgba(46,196,198,0.3);
  }
  .btn-primary:hover{opacity:0.9;box-shadow:0 4px 18px rgba(46,196,198,0.4);}
  .btn-secondary{
    background:#fff;color:#374151;font-weight:600;border-radius:12px;
    padding:10px 24px;border:1.5px solid #e5e7eb;transition:all .2s;
  }
  .btn-secondary:hover{border-color:#2ec4c6;color:#1fa8aa;}

  /* ── Battle card ── */
  .battle-card{
    background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;
    border:2px solid transparent;transition:all .18s;
    box-shadow:0 2px 12px rgba(0,0,0,0.07);
  }
  .battle-card:hover{
    border-color:#2ec4c6;transform:translateY(-4px);
    box-shadow:0 8px 24px rgba(46,196,198,0.25);
  }

  /* ── Progress bar ── */
  .progress-track{background:#e6fafa;border-radius:999px;height:8px;}
  .progress-fill{
    background:linear-gradient(90deg,#2ec4c6,#1fa8aa);
    border-radius:999px;height:8px;transition:width .5s ease;
  }

  /* ── Rank badge (opsi 2: left border + badge, bukan full-row color) ── */
  .rank-row{background:#fff;border-bottom:1px solid #f3f4f6;}
  .rank-row:last-child{border-bottom:none;}
  .rank-row.top{background:#fafffe;}

  /* Badge bulat untuk nomor rank */
  .badge-1{
    background:linear-gradient(135deg,#F5E6A3,#C9A84C);
    color:#7a5a00;font-weight:800;
    box-shadow:0 2px 8px rgba(201,168,76,0.4),inset 0 1px 0 rgba(255,255,255,0.5);
    border:1.5px solid rgba(201,168,76,0.6);
  }
  .badge-2{
    background:linear-gradient(135deg,#E8E8E8,#9E9E9E);
    color:#4a4a4a;font-weight:800;
    box-shadow:0 2px 8px rgba(158,158,158,0.4),inset 0 1px 0 rgba(255,255,255,0.6);
    border:1.5px solid rgba(158,158,158,0.5);
  }
  .badge-3{
    background:linear-gradient(135deg,#E8C49A,#8B5E3C);
    color:#fff;font-weight:800;
    box-shadow:0 2px 8px rgba(139,94,60,0.4),inset 0 1px 0 rgba(255,255,255,0.25);
    border:1.5px solid rgba(139,94,60,0.5);
  }
  .badge-other{
    background:#f3f4f6;color:#9ca3af;font-weight:700;
  }

  /* Left accent border untuk top 3 */
  .accent-1{border-left:4px solid #C9A84C;}
  .accent-2{border-left:4px solid #9E9E9E;}
  .accent-3{border-left:4px solid #8B5E3C;}

  /* ── Senbatsu stage (simplified) ── */
  .stage-simple{
    background:#fff;
    padding:24px 16px;
    border-radius:16px;
  }
  .center-glow{
    box-shadow:0 0 18px rgba(255,215,0,0.85),0 0 36px rgba(255,215,0,0.4);
    border:2.5px solid rgba(255,215,0,0.9);
  }

  /* ── Spotify ── */
  .spotify-frame{border-radius:12px;width:100%;display:block;}

  /* ── Song battle card ── */
  .song-card{
    background:#fff;border-radius:16px;padding:16px;
    border:2px solid transparent;transition:all .18s;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
  }
  .song-card:hover{border-color:#2ec4c6;box-shadow:0 4px 20px rgba(46,196,198,0.18);}

  /* ── Page bg ── */
  body{background:#f0fafa;min-height:100vh;}

  /* ── Input ── */
  .input-base{
    border:1.5px solid #e5e7eb;border-radius:10px;padding:9px 13px;
    font-size:0.9rem;width:100%;outline:none;transition:border .2s;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .input-base:focus{border-color:#2ec4c6;box-shadow:0 0 0 3px rgba(46,196,198,0.12);}

  /* ── Love Fortune card ── */
  .love-card{
    background:linear-gradient(135deg,#fff5fb 0%,#fff0f8 40%,#f0fafa 100%);
    border-radius:20px;overflow:hidden;
    box-shadow:0 4px 24px rgba(236,72,153,0.12),0 1px 4px rgba(0,0,0,0.06);
    border:1.5px solid rgba(236,72,153,0.15);
    position:relative;
  }
  .love-card::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at top right,rgba(236,72,153,0.08),transparent 60%);
    pointer-events:none;
  }
  .pct-ring-bg{stroke:#fce7f3;stroke-width:8;fill:none;}
  .pct-ring{stroke-width:8;fill:none;stroke-linecap:round;
            stroke:url(#loveGrad);transition:stroke-dashoffset 1.2s ease;}
  .quiz-opt{
    background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;
    padding:12px 16px;cursor:pointer;transition:all .18s;
    text-align:left;font-weight:600;font-size:0.875rem;color:#374151;
    width:100%;
  }
  .quiz-opt:hover{border-color:#f9a8d4;background:#fff5fb;color:#be185d;}
  .quiz-opt.selected{border-color:#ec4899;background:#fdf2f8;color:#be185d;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeInUp .4s ease both;}
  @keyframes heartPop{0%{transform:scale(0);}60%{transform:scale(1.2);}100%{transform:scale(1);}}
  .heart-pop{animation:heartPop .5s ease both;}
  .modal-inner{
    background:#fff;border-radius:20px;padding:20px;
    max-width:640px;width:100%;max-height:82vh;overflow-y:auto;position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header-bg text-white px-5 py-4 flex justify-between items-center relative z-10">
  <div class="flex items-center gap-2.5">
    <span class="text-2xl">🌧️</span>
    <span class="font-extrabold text-lg tracking-tight">Rain Tree Space</span>
  </div>
  <select id="langSelect" onchange="changeLang(this.value)"
    class="text-gray-700 rounded-lg px-3 py-1.5 text-sm font-semibold bg-white/90 border-0 outline-none cursor-pointer">
    <option value="jp" selected>日本語</option>
    <option value="id">Indonesia</option>
    <option value="en">English</option>
  </select>
</header>

<!-- NAV -->
<div class="nav-wrap">
  <nav id="nav" class="flex flex-wrap justify-center gap-1.5 py-2.5 px-4 max-w-5xl mx-auto"></nav>
</div>

<!-- MAIN -->
<main id="app" class="p-4 max-w-5xl mx-auto"></main>

<!-- SENBATSU MEMBER MODAL -->
<div id="memberModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
  <div class="modal-inner">
    <button onclick="closeModal()"
      class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full
             bg-gray-100 hover:bg-gray-200 text-gray-500 font-bold transition text-sm">✕</button>
    <h3 class="text-base font-bold mb-4 text-gray-800">Select Member</h3>
    <div id="memberGrid" class="grid grid-cols-3 md:grid-cols-5 gap-3"></div>
  </div>
</div>

<!-- MEMBER PROFILE MODAL -->
<div id="profileModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
  <div class="modal-inner" style="max-width:700px;">
    <button onclick="closeProfileModal()"
      class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full
             bg-gray-100 hover:bg-gray-200 text-gray-500 font-bold transition text-sm z-10">✕</button>
    <div id="profileContent"></div>
  </div>
</div>

<script>
/* =====================================================
   LANGUAGE
   ===================================================== */
let lang = 'jp';

const T = {
  home:       {id:'Home',          en:'Home',          jp:'ホーム'},
  members:    {id:'Members',       en:'Members',       jp:'メンバー'},
  member:     {id:'Member Sorter', en:'Member Sorter',  jp:'メンバーソート'},
  love:       {id:'Love Fortune',  en:'Love Fortune',   jp:'恋愛占い'},
  song:       {id:'Song Sorter',   en:'Song Sorter',    jp:'楽曲ソート'},
  senbatsu:   {id:'Dream Senbatsu',en:'Dream Senbatsu', jp:'夢の選抜'},
  download:   {id:'Download',      en:'Download',       jp:'保存'},
  autoFill:   {id:'Auto Fill',     en:'Auto Fill',      jp:'自動配置'},
  chooseCount:{id:'Jumlah Member', en:'Number of Members',jp:'人数選択'},
  draw:       {id:'Imbang',        en:'Draw',           jp:'引き分け'},
  start:      {id:'Mulai',         en:'Start',          jp:'スタート'},
  result:     {id:'Hasil',         en:'Result',         jp:'結果'},
  rank:       {id:'Peringkat',     en:'Rank',           jp:'順位'},
  name:       {id:'Nama',          en:'Name',           jp:'名前'},
  reset:      {id:'Ulangi',        en:'Reset',          jp:'リセット'},
  round:      {id:'Ronde',         en:'Round',          jp:'ラウンド'},
  progress:   {id:'Progres',       en:'Progress',       jp:'進捗'},
  chooseMem:  {id:'Pilih yang lebih kamu suka!', en:'Pick your favorite!', jp:'好きな方を選んでね！'},
  chooseSong: {id:'Pilih lagu favoritmu!', en:'Pick your favorite song!', jp:'好きな曲を選んでね！'},
  pick:       {id:'Pilih',         en:'Pick',           jp:'選ぶ'},
  of:         {id:'dari',          en:'of',             jp:'/'},
  songLabel:  {id:'lagu',          en:'songs',          jp:'曲'},
  top3:       {id:'Top 3 Preview', en:'Top 3 Preview',  jp:'トップ3プレビュー'},
  songTitle:  {id:'Judul',         en:'Title',          jp:'曲名'},
};
function tr(key){ return T[key]?T[key][lang]:key; }

/* =====================================================
   SUPABASE INIT
   ===================================================== */
const SUPABASE_URL = 'https://stxdidirwitbxoltmmrl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0eGRpZGlyd2l0YnhvbHRtbXJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NDYyNDAsImV4cCI6MjA4NzIyMjI0MH0.eDGo9i-6JMTyrO0wZt3ca6w6kAzbsVQCMax0kNHUNHo';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =====================================================
   MEMBERS & SONGS (Dynamic from Supabase)
   ===================================================== */
let members = [];
let songs = [];
let dataLoaded = false;

// Fetch data from Supabase
async function loadData(){
  try {
    // Fetch members
    const { data: membersData, error: membersError } = await supabase
      .from('members')
      .select('*')
      .order('id');
    
    if(membersError) throw membersError;
    
    // Transform to match existing structure
    members = membersData.map(m => ({
      id: m.id,
      name: {
        id: m.name_id,
        en: m.name_en,
        jp: m.name_jp
      },
      img: m.photo_url || `assets/members/${m.name_en.replace(' ', '_')}.jpeg`,
      mbti: m.mbti,
      birthdate: m.birthdate,
      height: m.height_cm,
      prefecture: m.prefecture,
      bloodType: m.blood_type,
      lightstick: m.lightstick_color,
      songs: m.song_participation,
      trivia: m.trivia,
      graduated: m.is_graduated
    }));
    
    // Fetch songs
    const { data: songsData, error: songsError } = await supabase
      .from('songs')
      .select('*')
      .order('id');
    
    if(songsError) throw songsError;
    
    songs = songsData.map(s => ({
      id: s.id,
      title: s.title,
      spotifyId: s.spotify_id
    }));
    
    dataLoaded = true;
    console.log('Data loaded:', members.length, 'members,', songs.length, 'songs');
    
  } catch(error){
    console.error('Error loading data:', error);
    alert('Gagal memuat data dari server. Silakan refresh halaman.');
  }
}

/* =====================================================
   NAV
   ===================================================== */
let currentPage = 'home';

function renderNav(){
  const pages = ['home','members','member','song','senbatsu','love'];
  document.getElementById('nav').innerHTML = pages.map(p =>
    `<button class="nav-btn ${currentPage===p?'active':''}" onclick="go('${p}')">${tr(p)}</button>`
  ).join('');
}

function changeLang(l){
  lang=l;
  renderNav();
  // Re-render halaman yang sedang aktif
  ({home, members:memberListPage, member:memberSorterPage, song:songSorterPage, senbatsu, love:loveFortune})[currentPage]?.();
}

function go(p){
  currentPage=p; renderNav();
  ({home, members:memberListPage, member:memberSorterPage, song:songSorterPage, senbatsu, love:loveFortune})[p]?.();
}

/* =====================================================
   HOME
   ===================================================== */
function home(){
  document.getElementById('app').innerHTML = `
    <div class="text-center mt-12 mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl
                  bg-white shadow-lg mb-4" style="box-shadow:0 4px 20px rgba(46,196,198,0.2)">
        <span class="text-3xl">🌧️</span>
      </div>
      <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight mb-1">Rain Tree Space</h1>
      <p class="text-gray-400 text-sm font-medium">ファンのためのファンツール</p>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 max-w-4xl mx-auto">
      ${[
        {p:'members',  icon:'👥', label:tr('members'),  sub:{id:'Profil lengkap member',en:'Complete member profiles',jp:'メンバープロフィール'}},
        {p:'member',  icon:'👑', label:tr('member'),  sub:{id:'Battle & ranking member',en:'Battle & ranking member',jp:'メンバーをバトルでランキング'}},
        {p:'song',    icon:'🎵', label:tr('song'),    sub:{id:'Battle lagu favoritmu', en:'Battle your favorite songs',jp:'曲をバトルでランキング'}},
        {p:'senbatsu',icon:'⭐', label:tr('senbatsu'),sub:{id:'Susun formasi impianmu', en:'Build your dream formation',jp:'夢のフォーメーションを組もう'}},
        {p:'love',    icon:'💌', label:tr('love'),    sub:{id:'Siapa member jodohmu?',  en:'Who is your destined member?',jp:'運命のメンバーは誰？'}},
      ].map(item=>`
        <button onclick="go('${item.p}')"
          class="card card-hover p-6 text-center group cursor-pointer
                 border border-transparent hover:border-primary/30">
          <div class="w-12 h-12 rounded-xl bg-primaryLight flex items-center justify-center
                      mx-auto mb-3 group-hover:bg-primary/15 transition text-2xl">
            ${item.icon}
          </div>
          <div class="font-bold text-gray-800 text-sm mb-1">${item.label}</div>
          <div class="text-xs text-gray-400 leading-snug">${item.sub[lang]}</div>
        </button>
      `).join('')}
    </div>`;
}

/* =====================================================
   MEMBER LIST & PROFILE
   ===================================================== */
function memberListPage(){
  if(!dataLoaded || members.length === 0){
    document.getElementById('app').innerHTML = '<div class="text-center py-20 text-gray-400">Loading members...</div>';
    return;
  }
  
  const activeMembers = members.filter(m => !m.graduated);
  const graduatedMembers = members.filter(m => m.graduated);
  
  document.getElementById('app').innerHTML = `
    <div class="max-w-4xl mx-auto">
      <h2 class="text-2xl font-extrabold text-gray-800 mb-6 text-center">${tr('members')}</h2>
      
      <!-- Active Members -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-8">
        ${activeMembers.map(m => `
          <div class="card card-hover cursor-pointer" onclick="showMemberProfile(${m.id})">
            <div style="background-image:url('${m.img}');background-size:cover;background-position:center;
                        padding-bottom:120%;border-radius:12px 12px 0 0;"></div>
            <div class="p-3 text-center">
              <div class="font-bold text-sm text-gray-800 truncate">${m.name[lang]}</div>
              <div class="text-xs text-gray-400 mt-1">${m.mbti}</div>
            </div>
          </div>
        `).join('')}
      </div>
      
      ${graduatedMembers.length > 0 ? `
        <h3 class="text-lg font-bold text-gray-600 mb-4">${lang==='jp'?'卒業メンバー':lang==='id'?'Anggota Lulus':'Graduated Members'}</h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 opacity-60">
          ${graduatedMembers.map(m => `
            <div class="card cursor-pointer" onclick="showMemberProfile(${m.id})">
              <div style="background-image:url('${m.img}');background-size:cover;background-position:center;
                          padding-bottom:120%;border-radius:12px 12px 0 0;filter:grayscale(50%);"></div>
              <div class="p-3 text-center">
                <div class="font-bold text-sm text-gray-800 truncate">${m.name[lang]}</div>
                <div class="text-xs text-gray-400 mt-1">${m.mbti}</div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

async function showMemberProfile(memberId){
  const member = members.find(m => m.id === memberId);
  if(!member) return;
  
  // Fetch member photos
  let photos = [];
  try {
    const { data, error } = await supabase
      .from('member_photos')
      .select('*')
      .eq('member_id', memberId)
      .order('year', { ascending: false })
      .order('display_order');
    
    if(!error && data) photos = data;
  } catch(err){
    console.error('Error loading photos:', err);
  }
  
  // Calculate age if birthdate exists
  let ageText = '';
  if(member.birthdate){
    const birth = new Date(member.birthdate);
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const monthDiff = today.getMonth() - birth.getMonth();
    if(monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) age--;
    
    const months = {jp:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
                    id:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'],
                    en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
    const monthName = months[lang][birth.getMonth()];
    const dateStr = lang==='jp' ? `${birth.getFullYear()}年${monthName}${birth.getDate()}日` :
                    `${birth.getDate()} ${monthName} ${birth.getFullYear()}`;
    ageText = `${dateStr} (${age} ${lang==='jp'?'歳':lang==='id'?'tahun':'y.o'})`;
  }
  
  document.getElementById('profileContent').innerHTML = `
    <div class="relative">
      <!-- Header Image -->
      <div style="background-image:url('${member.img}');background-size:cover;background-position:center;
                  height:300px;border-radius:12px 12px 0 0;"></div>
      
      <!-- Profile Info -->
      <div class="p-6">
        <h2 class="text-2xl font-extrabold text-gray-800 mb-1">${member.name[lang]}</h2>
        <div class="text-gray-500 text-sm mb-4">
          ${lang==='jp' ? member.name.jp : lang==='id' ? member.name.id : member.name.en}
          ${member.graduated ? ` (${lang==='jp'?'卒業':lang==='id'?'Lulus':'Graduated'})` : ''}
        </div>
        
        <!-- Basic Info Grid -->
        <div class="grid grid-cols-2 gap-3 mb-5">
          ${member.birthdate ? `
            <div class="bg-gray-50 p-3 rounded-lg">
              <div class="text-xs text-gray-500 font-semibold mb-1">${lang==='jp'?'生年月日':lang==='id'?'Tanggal Lahir':'Birthday'}</div>
              <div class="text-sm font-bold text-gray-800">${ageText}</div>
            </div>
          ` : ''}
          
          ${member.height ? `
            <div class="bg-gray-50 p-3 rounded-lg">
              <div class="text-xs text-gray-500 font-semibold mb-1">${lang==='jp'?'身長':lang==='id'?'Tinggi':'Height'}</div>
              <div class="text-sm font-bold text-gray-800">${member.height} cm</div>
            </div>
          ` : ''}
          
          ${member.prefecture ? `

/* =====================================================
   SWISS ENGINE
   ===================================================== */
function createSwiss(items){
  const players = items.map(item=>({
    ...item, wins:0, losses:0, draws:0, score:0, opponents:[], buchholz:0
  }));
  const totalRounds = Math.max(Math.ceil(Math.log2(players.length))*2, 3);
  const totalBattles = Math.floor(players.length/2) * totalRounds;
  return {players, totalRounds, totalBattles, currentRound:1, pairs:[], pairIdx:0, done:false};
}

function swissPair(state){
  const sorted = [...state.players].sort((a,b)=>
    b.score!==a.score ? b.score-a.score :
    b.buchholz!==a.buchholz ? b.buchholz-a.buchholz : Math.random()-0.5
  );
  const paired=new Set(), pairs=[];
  for(let i=0;i<sorted.length;i++){
    if(paired.has(sorted[i].id)) continue;
    let found=false;
    for(let j=i+1;j<sorted.length;j++){
      if(paired.has(sorted[j].id)) continue;
      if(!sorted[i].opponents.includes(sorted[j].id)){
        pairs.push([sorted[i],sorted[j]]);
        paired.add(sorted[i].id); paired.add(sorted[j].id);
        found=true; break;
      }
    }
    if(!found){
      for(let j=i+1;j<sorted.length;j++){
        if(!paired.has(sorted[j].id)){
          pairs.push([sorted[i],sorted[j]]);
          paired.add(sorted[i].id); paired.add(sorted[j].id);
          break;
        }
      }
    }
  }
  return pairs;
}

function swissApply(state, winnerId, loserId, isDraw){
  const w=state.players.find(p=>p.id===winnerId);
  const l=state.players.find(p=>p.id===loserId);
  if(!w||!l) return;
  if(isDraw){ w.draws++; w.score+=1; l.draws++; l.score+=1; }
  else { w.wins++; w.score+=2; l.losses++; }
  if(!w.opponents.includes(l.id)) w.opponents.push(l.id);
  if(!l.opponents.includes(w.id)) l.opponents.push(w.id);
  state.players.forEach(p=>{
    p.buchholz=p.opponents.reduce((s,oid)=>{
      const o=state.players.find(x=>x.id===oid); return s+(o?o.score:0);
    },0);
  });
}

function swissRanking(state){
  return [...state.players].sort((a,b)=>
    b.score!==a.score?b.score-a.score:
    b.buchholz!==a.buchholz?b.buchholz-a.buchholz:
    b.wins!==a.wins?b.wins-a.wins:0
  );
}

function swissNextPair(state){
  if(state.pairIdx>=state.pairs.length){
    state.currentRound++;
    if(state.currentRound>state.totalRounds){state.done=true;return false;}
    state.pairs=swissPair(state); state.pairIdx=0;
    if(state.pairs.length===0){state.done=true;return false;}
  }
  return true;
}

/* ── Progress bar ── */
function progressBar(state){
  const done=(state.currentRound-1)*Math.floor(state.players.length/2)+state.pairIdx;
  const pct=Math.min(Math.round((done/state.totalBattles)*100),99);
  return `
    <div class="card p-4 mb-5">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
          ${tr('round')} ${state.currentRound} ${tr('of')} ${state.totalRounds}
        </span>
        <span class="text-xs font-bold text-primary">${pct}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>`;
}

/* ── Rank badge ── */
function rankBadge(r){
  const cls = r===1?'badge-1':r===2?'badge-2':r===3?'badge-3':'badge-other';
  const sym = r===1?'👑':r===2?'②':r===3?'③':String(r);
  // untuk r<=3 pakai emoji mahkota, untuk 2&3 pakai teks angka dengan style
  const label = r===1?'1':r===2?'2':r===3?'3':String(r);
  return `<span class="${cls} inline-flex items-center justify-center w-8 h-8 rounded-full text-sm">${r<=3&&r>1?label:r===1?'👑':label}</span>`;
}
function accentClass(r){ return r===1?'accent-1':r===2?'accent-2':r===3?'accent-3':''; }

let formation=[], senbatsuCount=7, activeSlot=null;

function senbatsu(){
  document.getElementById('app').innerHTML=`
    <div class="card p-5">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xl">⭐</span>
        <h2 class="text-lg font-extrabold text-gray-800">${tr('senbatsu')}</h2>
      </div>
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">
        ${tr('chooseCount')} (3–17)
      </label>
      <input type="number" min="3" max="17" value="${senbatsuCount}"
        onchange="senbatsuCount=parseInt(this.value);generateFormation()"
        class="input-base mb-4" style="max-width:120px">
      <div class="flex gap-2 mb-4">
        <button onclick="autoFill()" class="btn-primary text-sm py-2">${tr('autoFill')}</button>
        <button onclick="clearFormation()" class="btn-secondary text-sm py-2">Clear</button>
      </div>
      <div id="stage" class="stage-simple space-y-0.5"></div>
      <div class="mt-4 text-center">
        <button onclick="downloadStage()" class="btn-primary">⬇ ${tr('download')}</button>
      </div>
    </div>`;
  generateFormation();
}

function generateFormation(){
  formation=[];
  let n=parseInt(senbatsuCount);
  if(isNaN(n)||n<3) n=3;
  if(n>17) n=17;
  const presets={
    3:[[3]],4:[[4]],5:[[5]],
    6:[[3],[3]],7:[[4],[3]],8:[[5],[3]],9:[[5],[4]],10:[[6],[4]],
    11:[[4],[4],[3]],12:[[5],[4],[3]],13:[[5],[5],[3]],
    14:[[6],[5],[3]],15:[[6],[6],[3]],16:[[7],[6],[3]],17:[[7],[7],[3]],
  };
  const rows=presets[n]||[[n]];
  formation=rows.map(r=>Array(r[0]).fill(null));
  renderStage();
}

function renderStage(){
  const stage=document.getElementById('stage');
  if(!stage) return;
  stage.innerHTML='';
  const isFrontRow=ri=>ri===formation.length-1;
  formation.forEach((row,ri)=>{
    const div=document.createElement('div');
    div.className='flex justify-center gap-0';
    row.forEach((slot,ci)=>{
      const box=document.createElement('div');
      const isFront=isFrontRow(ri);
      const len=row.length;
      const isCenter=isFront&&(len%2===1?ci===Math.floor(len/2):ci===len/2-1||ci===len/2);
      // Smaller box with explicit inline size for better html2canvas rendering
      box.style.width='64px';
      box.style.height='64px';
      box.className=`bg-white rounded flex items-center justify-center
                     cursor-pointer hover:bg-gray-50 transition flex-shrink-0
                     ${isCenter&&slot?'border-2 border-primary':'border border-gray-200'}`;
      box.onclick=()=>selectMember(ri,ci);
      if(slot){
        box.innerHTML=`
          <div style="position:relative;width:100%;height:100%;background-image:url('${slot.img}');
                      background-size:cover;background-position:center;border-radius:2px;">
            <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);
                        color:white;text-align:center;padding:2px 4px;font-size:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
              ${slot.name[lang]}
            </div>
          </div>`;
      } else {
        box.innerHTML=`<span class="text-xl text-gray-300">+</span>`;
      }
      div.appendChild(box);
    });
    stage.appendChild(div);
  });
}

function selectMember(r,c){activeSlot={row:r,col:c};openModal();}

function openModal(){
  const mm=document.getElementById('memberModal');
  const mg=document.getElementById('memberGrid');
  mm.classList.remove('hidden'); mm.classList.add('flex');
  mg.innerHTML='';
  members.forEach(m=>{
    const used=formation.some(row=>row.some(s=>s?.id===m.id));
    const div=document.createElement('div');
    div.className=`text-center cursor-pointer ${used?'opacity-40 pointer-events-none':'hover:scale-105 transition'}`;
    div.innerHTML=`
      <img src="${m.img}" class="w-full aspect-square object-cover rounded-lg border-2
           ${used?'border-gray-200':'border-primary/50'}">
      <div class="text-xs mt-1 font-medium text-gray-700 truncate">${m.name[lang]}</div>`;
    if(!used) div.onclick=()=>selectFromModal(m.id);
    mg.appendChild(div);
  });
}

function closeModal(){
  const mm=document.getElementById('memberModal');
  mm.classList.add('hidden'); mm.classList.remove('flex');
}

function selectFromModal(id){
  const m=members.find(x=>x.id===id);
  if(!m||!activeSlot) return;
  formation[activeSlot.row][activeSlot.col]=m;
  closeModal(); renderStage();
}

function clearFormation(){formation=formation.map(r=>r.map(()=>null));renderStage();}

function autoFill(){
  const shuffled=[...members].sort(()=>Math.random()-0.5);
  let i=0;
  formation=formation.map(r=>r.map(()=>shuffled[i++]||null));
  renderStage();
}

function downloadStage(){
  const stage=document.getElementById('stage');
  if(!stage) return;
  // Get actual rendered dimensions
  const rect = stage.getBoundingClientRect();
  html2canvas(stage,{
    useCORS:true,
    backgroundColor:'#ffffff',
    scale:2,
    width:rect.width,
    height:rect.height
  }).then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download='dream-senbatsu.png'; a.click();
  });
}

        ${lang==='jp'?'占いスタート 💕':lang==='id'?'Mulai Ramalan 💕':'Start Fortune 💕'}
      </button>
    </div>`;
}

function startLoveQuiz(){
  const input = document.getElementById('loveNameInput');
  loveState.userName = (input?.value||'').trim() || (lang==='jp'?'あなた':lang==='id'?'Kamu':'You');
  loveState.dims = {E:0,I:0,N:0,S:0,F:0,T:0,J:0,P:0};
  loveState.qIndex = 0;
  renderLoveQuestion();
}

function renderLoveQuestion(){
  const qi = loveState.qIndex;
  const total = quizData.questions.length;
  if(qi >= total){ computeLoveResult(); return; }

  const q = quizData.questions[qi];
  const pct = Math.round((qi/total)*100);

  document.getElementById('app').innerHTML=`
    <div class="max-w-lg mx-auto fade-in">
      <!-- progress -->
      <div class="card p-4 mb-4">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
            ${lang==='jp'?`質問 ${qi+1} / ${total}`:lang==='id'?`Pertanyaan ${qi+1} / ${total}`:`Question ${qi+1} / ${total}`}
          </span>
          <span class="text-xs font-bold" style="color:#ec4899">${pct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,#f9a8d4,#ec4899);"></div>
        </div>
      </div>

      <!-- question -->
      <div class="card p-6 mb-3">
        <p class="font-bold text-gray-800 text-base mb-5 text-center leading-snug">${q[lang]}</p>
        <div class="space-y-2.5">
          ${q.opts.map((opt,oi)=>`
            <button class="quiz-opt" onclick="answerLove(${oi})">
              ${opt[lang]}
            </button>`).join('')}
        </div>
      </div>
    </div>`;
}

function answerLove(optIndex){
  const q = quizData.questions[loveState.qIndex];
  const dim = q.opts[optIndex].dim;
  Object.keys(dim).forEach(k=>{ loveState.dims[k] = (loveState.dims[k]||0) + dim[k]; });
  loveState.qIndex++;
  renderLoveQuestion();
}

function computeLoveResult(){
  const d = loveState.dims;
  // Determine user MBTI from accumulated dims
  const EI = d.E >= d.I ? 'E' : 'I';
  const NS = d.N >= d.S ? 'N' : 'S';
  const FT = d.F >= d.T ? 'F' : 'T';
  const JP = d.J >= d.P ? 'J' : 'P';
  const userMBTI = EI+NS+FT+JP;

  // Score each member
  const scored = members.map(m=>{
    const mtype = memberMBTI[m.id];
    const score = getMBTICompat(userMBTI, mtype);
    // Add small jitter to avoid ties
    return {...m, mbti:mtype, score: score + Math.random()*3};
  }).sort((a,b)=>b.score-a.score);

  const best = scored[0];
  const rawScore = Math.round(best.score);
  // Clamp display 60-99
  const displayPct = Math.min(99, Math.max(60, rawScore));

  // Pick narrative
  const tier = displayPct>=85?'hi':displayPct>=70?'mid':'lo';
  const narrs = compatNarrative[lang][tier];
  const narr = narrs[Math.floor(Math.random()*narrs.length)];

  renderLoveResult(best, userMBTI, displayPct, narr, scored.slice(1,4));
}

function renderLoveResult(best, userMBTI, pct, narr, runners){
  document.getElementById('app').innerHTML=`
    <div class="max-w-md mx-auto fade-in">
      <div class="text-center mb-4">
        <h2 class="text-xl font-extrabold text-gray-800">💌 ${tr('result')}</h2>
        <p class="text-gray-400 text-sm">${loveState.userName} × ${best.name[lang]}</p>
      </div>

      <!-- Main card -->
      <div id="loveResultCard" class="love-card p-6 mb-4">
        <!-- Header -->
        <div class="text-center mb-5">
          <div class="inline-block text-xs font-bold px-3 py-1 rounded-full mb-3"
               style="background:rgba(236,72,153,0.1);color:#be185d;">
            ${lang==='jp'?'あなたのMBTI':lang==='id'?'MBTI kamu':'Your MBTI'}: <span class="font-extrabold">${userMBTI}</span>
          </div>
        </div>

        <!-- Member photo + CSS ring -->
        <div class="flex flex-col items-center mb-5">
          <div class="relative mb-3" style="width:140px;height:140px;">
            <!-- CSS-based ring (more reliable for html2canvas) -->
            <div style="position:absolute;top:0;left:0;width:140px;height:140px;border-radius:50%;
                        background:conic-gradient(from 0deg, #f9a8d4 0%, #ec4899 ${pct}%, #fce7f3 ${pct}% 100%);
                        padding:12px;">
              <!-- Photo as background -->
              <div style="width:116px;height:116px;border-radius:50%;
                          background-image:url('${best.img}');background-size:cover;background-position:center;
                          border:3px solid white;box-shadow:0 4px 16px rgba(236,72,153,0.25);">
              </div>
            </div>
          </div>
          <div class="text-3xl font-extrabold" style="color:#be185d;">${pct}%</div>
          <div class="text-xs text-gray-400 font-semibold mt-0.5">
            ${lang==='jp'?'相性スコア':lang==='id'?'Skor kecocokan':'Compatibility score'}
          </div>
        </div>

        <!-- Member name & MBTI -->
        <div class="text-center mb-4">
          <div class="text-xl font-extrabold text-gray-800">${best.name[lang]}</div>
          <div class="inline-block text-xs font-bold px-2.5 py-0.5 rounded-full mt-1"
               style="background:rgba(46,196,198,0.12);color:#1fa8aa;">
            ${best.mbti}
          </div>
        </div>

        <!-- Divider -->
        <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(236,72,153,0.2),transparent);margin-bottom:16px;"></div>

        <!-- Narrative -->
        <p class="text-gray-600 text-sm text-center leading-relaxed px-2">${narr}</p>

        <!-- Runner-ups -->
        <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(236,72,153,0.15),transparent);margin:16px 0;"></div>
        <div class="text-xs font-bold text-center text-gray-400 uppercase tracking-wider mb-3">
          ${lang==='jp'?'次点':lang==='id'?'Runner-up':'Runner-up'}
        </div>
        <div class="flex justify-center gap-4">
          ${runners.map(m=>`
            <div class="text-center">
              <div style="width:48px;height:48px;border-radius:8px;margin:0 auto 4px;
                          background-image:url('${m.img}');background-size:cover;background-position:center;
                          border:2px solid #fce7f3;"></div>
              <div class="text-xs font-semibold text-gray-600 truncate" style="max-width:60px">${m.name[lang]}</div>
              <div class="text-xs text-gray-400">${Math.min(99,Math.round(m.score))}%</div>
            </div>`).join('')}
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex gap-3 justify-center">
        <button onclick="shareToX('love',{member:'${best.name[lang]}',pct:${pct}})"
          class="btn-primary" style="background:linear-gradient(135deg,#1DA1F2,#0c85d0);">
          🐦 Share
        </button>
        <button onclick="downloadLoveCard()"
          class="btn-primary" style="background:linear-gradient(135deg,#f472b6,#ec4899);">
          ⬇ ${tr('download')}
        </button>
        <button onclick="loveFortune()" class="btn-secondary">🔄 ${tr('reset')}</button>
      </div>
    </div>`;
}

function downloadLoveCard(){
  const el=document.getElementById('loveResultCard');
  if(!el){
    alert('Card not found. Please try again.');
    return;
  }
  
  // Allow taint for background-image CORS support
  html2canvas(el,{
    useCORS:true,
    allowTaint:true,
    backgroundColor:'#fff5fb',
    scale:2,
    logging:false,
    foreignObjectRendering:false
  }).then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download='love-fortune.png';
    a.click();
  }).catch(err=>{
    console.error('Download error:',err);
    alert('Download failed: '+err.message);
  });
}
