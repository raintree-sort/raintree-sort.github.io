/* =====================================================
   SWISS ENGINE
   ===================================================== */
function createSwiss(items){
  const players = items.map(item=>({
    ...item,
    wins:0, losses:0, draws:0, score:0, opponents:[], buchholz:0
  }));
  const totalRounds = Math.max(Math.ceil(Math.log2(players.length))*2, 3);
  const totalBattles = Math.floor(players.length/2) * totalRounds;
  return {players, totalRounds, totalBattles, currentRound:1, pairs:[], pairIdx:0, done:false};
}

function swissPair(state){
  const sorted = [...state.players].sort((a,b)=>
    b.score!==a.score ? b.score-a.score :
    b.buchholz!==a.buchholz ? b.buchholz-a.buchholz :
    Math.random()-0.5
  );
  const paired=new Set(), pairs=[];
  for(let i=0;i<sorted.length;i++){
    if(paired.has(sorted[i].id)) continue;
    let found=false;
    for(let j=i+1;j<sorted.length;j++){
      if(paired.has(sorted[j].id)) continue;
      if(!sorted[i].opponents.includes(sorted[j].id)){
        pairs.push([sorted[i],sorted[j]]);
        paired.add(sorted[i].id); paired.add(sorted[j].id);
        found=true; break;
      }
    }
    if(!found){
      for(let j=i+1;j<sorted.length;j++){
        if(!paired.has(sorted[j].id)){
          pairs.push([sorted[i],sorted[j]]);
          paired.add(sorted[i].id); paired.add(sorted[j].id);
          break;
        }
      }
    }
  }
  return pairs;
}

function swissApply(state, winnerId, loserId, isDraw){
  const w = state.players.find(p=>p.id===winnerId);
  const l = state.players.find(p=>p.id===loserId);
  if(!w||!l) return;
  if(isDraw){
    w.draws++; w.score+=1;
    l.draws++; l.score+=1;
  } else {
    w.wins++;  w.score+=2;
    l.losses++;
  }
  if(!w.opponents.includes(l.id)) w.opponents.push(l.id);
  if(!l.opponents.includes(w.id)) l.opponents.push(w.id);
  state.players.forEach(p=>{
    p.buchholz = p.opponents.reduce((s,oid)=>{
      const opp=state.players.find(x=>x.id===oid);
      return s+(opp?opp.score:0);
    },0);
  });
}

function swissRanking(state){
  return [...state.players].sort((a,b)=>
    b.score!==a.score ? b.score-a.score :
    b.buchholz!==a.buchholz ? b.buchholz-a.buchholz :
    b.wins!==a.wins ? b.wins-a.wins : 0
  );
}

function swissProgress(state){
  const done = (state.currentRound-1)*Math.floor(state.players.length/2) + state.pairIdx;
  return Math.min(Math.round((done/state.totalBattles)*100), 99);
}

function swissNextPair(state){
  if(state.pairIdx >= state.pairs.length){
    state.currentRound++;
    if(state.currentRound > state.totalRounds){ state.done=true; return false; }
    state.pairs = swissPair(state);
    state.pairIdx = 0;
    if(state.pairs.length===0){ state.done=true; return false; }
  }
  return true;
}

/* ----- Shared progress bar HTML ----- */
function progressBar(state){
  const pct = swissProgress(state);
  return `
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <div class="flex justify-between text-sm text-gray-500 mb-1">
        <span>${tr('round')} ${state.currentRound} ${tr('of')} ${state.totalRounds}</span>
        <span>${tr('progress')}: ${pct}%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-3">
        <div class="bg-primary h-3 rounded-full progress-bar" style="width:${pct}%"></div>
      </div>
    </div>`;
}

function rkTxt(r){ return r<=3?'text-white font-semibold':'text-gray-700'; }

      <!-- Top 3 Spotify embeds -->
      <div class="bg-white rounded-xl shadow p-4 mb-4">
        <h3 class="font-bold text-center text-gray-700 mb-3">🏆 ${tr('top3')}</h3>
        <div class="space-y-3">
          ${ranked.slice(0,3).map((s,i)=>`
            <div>
              <div class="text-xs font-bold text-gray-500 mb-1">${medal(i+1)} ${s.title}</div>
              <iframe
                src="https://open.spotify.com/embed/track/${s.spotifyId}?utm_source=generator&theme=0"
                width="100%" height="80" frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy" class="spotify-frame"></iframe>
            </div>`).join('')}
        </div>
      </div>

      <!-- Full ranking table -->
      <div id="songResultTable" class="bg-white rounded-xl shadow overflow-hidden mb-4">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="bg-primary text-white text-sm">
              <th class="px-3 py-2 w-16">${tr('rank')}</th>
              <th class="px-3 py-2 text-left">${tr('songTitle')}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>

      <div class="flex gap-3 justify-center">
        <button onclick="dlTable('songResultTable','song-ranking')"
          class="bg-primary text-white px-5 py-2 rounded-xl font-semibold hover:opacity-90 transition">
          ⬇ ${tr('download')}
        </button>
        <button onclick="songSorterPage()"
          class="border-2 border-gray-300 text-gray-600 px-5 py-2 rounded-xl font-semibold hover:border-primary transition">
          🔄 ${tr('reset')}
        </button>
      </div>
    </div>`;
}

/* =====================================================
   DOWNLOAD TABLE AS PNG
   ===================================================== */
function dlTable(id, filename){
  const el = document.getElementById(id);
  if(!el) return;
  html2canvas(el,{useCORS:true,backgroundColor:'#ffffff',scale:2}).then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download=filename+'.png';
    a.click();
  });
}

/* =====================================================
   SENBATSU
   ===================================================== */
let formation=[], senbatsuCount=7, activeSlot=null;

function senbatsu(){
  document.getElementById('app').innerHTML=`
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-xl font-bold mb-3">⭐ ${tr('senbatsu')}</h2>
      <label class="block text-sm text-gray-600 mb-1">${tr('chooseCount')} (3–17)</label>
      <input type="number" min="3" max="17" value="${senbatsuCount}"
        onchange="senbatsuCount=parseInt(this.value);generateFormation()"
        class="border p-2 rounded w-full mb-3">
      <div class="flex gap-2 mb-3">
        <button onclick="autoFill()" class="bg-primary text-white px-3 py-2 rounded">${tr('autoFill')}</button>
        <button onclick="clearFormation()" class="bg-gray-200 text-gray-700 px-3 py-2 rounded">Clear</button>
      </div>
      <div id="stage" class="stage-bg space-y-1"></div>
      <button onclick="downloadStage()" class="mt-4 bg-primary text-white px-4 py-2 rounded block mx-auto">
        ⬇ ${tr('download')}
      </button>
    </div>`;
  generateFormation();
}

function generateFormation(){
  formation=[];
  let n=parseInt(senbatsuCount);
  if(isNaN(n)||n<3) n=3;
  if(n>17) n=17;

  // Format: [baris belakang, ..., baris depan]  → piramida naik (belakang lebih banyak)
  const presets={
    3: [[3]],
    4: [[4]],
    5: [[5]],
    6: [[3],[3]],
    7: [[4],[3]],
    8: [[5],[3]],
    9: [[5],[4]],
    10:[[6],[4]],
    11:[[4],[4],[3]],
    12:[[5],[4],[3]],
    13:[[5],[5],[3]],
    14:[[6],[5],[3]],
    15:[[6],[6],[3]],
    16:[[7],[6],[3]],
    17:[[7],[7],[3]],
  };
  const rows = presets[n] || [[n]];
  // rows[0] = baris paling belakang (atas di stage), rows[last] = baris paling depan (bawah)
  formation = rows.map(r => Array(r[0]).fill(null));
  renderStage();
}

function renderStage(){
  const stage=document.getElementById('stage');
  if(!stage) return;
  stage.innerHTML='';
  const isFrontRow=(ri)=> ri===formation.length-1;
  formation.forEach((row,ri)=>{
    const div=document.createElement('div');
    div.className=`flex justify-center gap-1`;
    row.forEach((slot,ci)=>{
      const box=document.createElement('div');
      const isFront=isFrontRow(ri);
      const len=row.length;
      const isCenter=isFront&&(
        len%2===1
          ? ci===Math.floor(len/2)
          : ci===len/2-1||ci===len/2
      );
      box.className=`w-20 h-20 bg-white/10 rounded-lg flex items-center justify-center
                     cursor-pointer text-white hover:bg-white/20 transition flex-shrink-0
                     ${isCenter&&slot?'center-glow':''}`;
      box.onclick=()=>selectMember(ri,ci);
      if(slot){
        box.innerHTML=`
          <div class="relative w-full h-full">
            <img src="${slot.img}" class="w-full h-full object-cover rounded-lg">
            <div class="absolute bottom-0 left-0 right-0 bg-black/50 text-white text-xs
                        text-center py-0.5 rounded-b-lg truncate px-1">${slot.name[lang]}</div>
          </div>`;
      } else {
        box.innerHTML=`<span class="text-2xl opacity-40">+</span>`;
      }
      div.appendChild(box);
    });
    stage.appendChild(div);
  });
}

function selectMember(r,c){ activeSlot={row:r,col:c}; openModal(); }

function openModal(){
  const mm=document.getElementById('memberModal');
  const mg=document.getElementById('memberGrid');
  mm.classList.remove('hidden'); mm.classList.add('flex');
  mg.innerHTML='';
  members.forEach(m=>{
    const used=formation.some(row=>row.some(s=>s?.id===m.id));
    const div=document.createElement('div');
    div.className=`text-center cursor-pointer ${used?'opacity-40 pointer-events-none':'hover:scale-105 transition'}`;
    div.innerHTML=`
      <img src="${m.img}" class="w-full aspect-square object-cover rounded-lg border-2 ${used?'border-gray-300':'border-primary'}">
      <div class="text-xs mt-1">${m.name[lang]}</div>`;
    if(!used) div.onclick=()=>selectFromModal(m.id);
    mg.appendChild(div);
  });
}

function closeModal(){
  const mm=document.getElementById('memberModal');
  mm.classList.add('hidden'); mm.classList.remove('flex');
}

function selectFromModal(id){
  const m=members.find(x=>x.id===id);
  if(!m||!activeSlot) return;
  formation[activeSlot.row][activeSlot.col]=m;
  closeModal(); renderStage();
}

function clearFormation(){ formation=formation.map(r=>r.map(()=>null)); renderStage(); }

function autoFill(){
  const shuffled=[...members].sort(()=>Math.random()-0.5);
  let i=0;
  formation=formation.map(r=>r.map(()=>shuffled[i++]||null));
  renderStage();
}

function downloadStage(){
  const stage=document.getElementById('stage');
  if(!stage) return;
  html2canvas(stage,{useCORS:true,backgroundColor:'#0f2027'}).then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download='dream-senbatsu.png'; a.click();
  });
}

/* =====================================================
   INIT
   ===================================================== */
renderNav();
home();
</script>
