<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Tree Fans Tools</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
tailwind.config={
  theme:{extend:{colors:{primary:'#2ec4c6'}}}
}
</script>
</head>

<body class="bg-gradient-to-br from-primary/20 to-white min-h-screen text-gray-800">

<header class="bg-primary text-white p-4 flex justify-between items-center">
  <h1 class="font-bold text-lg">Rain Tree Fans Tools</h1>
  <select id="langSelect" class="text-black rounded px-2 py-1">
    <option value="id">Indonesia</option>
    <option value="en">English</option>
    <option value="jp">日本語</option>
  </select>
</header>

<nav id="nav" class="flex justify-center gap-4 py-3 bg-white shadow"></nav>
<main id="app" class="p-4 max-w-5xl mx-auto"></main>

<script>
/* ================= I18N ================= */
const t={
  home:{id:'Home',en:'Home',jp:'ホーム'},
  member:{id:'Sorter Member',en:'Member Sorter',jp:'メンバーソート'},
  love:{id:'Ramalan Cinta',en:'Love Fortune',jp:'恋愛占い'},
  song:{id:'Sorter Lagu',en:'Song Sorter',jp:'楽曲ソート'},
  result:{id:'Hasil Sorter',en:'Sorter Result',jp:'ソート結果'},
  download:{id:'Unduh Hasil',en:'Download Result',jp:'結果を保存'},
  pickMember:{id:'Pilih member favoritmu',en:'Pick your favorite member',jp:'好きなメンバーを選んでください'},
  pickSong:{id:'Pilih lagu favorit',en:'Pick your favorite song',jp:'好きな楽曲を選んでください'},
  loveBtn:{id:'Lihat Ramalan',en:'See Fortune',jp:'占う'},
  yourName:{id:'Nama kamu',en:'Your name',jp:'あなたの名前'},
  percent:{id:'Kecocokan',en:'Compatibility',jp:'相性'},
  homeDesc:{
    id:'Alat seru untuk fans Rain Tree 💎',
    en:'Fun tools for Rain Tree fans 💎',
    jp:'Rain Treeファンのための楽しいツール💎'
  }
};

/* ================= DATA ================= */
const members=[
 {id:1,name:{id:'Asamiya Hinata',en:'Asamiya Hinata',jp:'朝宮日向'},img:'assets/members/Asamiya_Hinata.jpeg'},
 {id:2,name:{id:'Ayase Kotori',en:'Ayase Kotori',jp:'綾瀬ことり'},img:'assets/members/Ayase_Kotori.jpeg'},
 {id:3,name:{id:'Ichihara Tsumugi',en:'Ichihara Tsumugi',jp:'市原紬希'},img:'assets/members/Ichihara_Tsumugi.jpeg'},
 {id:4,name:{id:'Endo Rino',en:'Endo Rino',jp:'遠藤莉乃'},img:'assets/members/Endo_Rino.jpeg'},
 {id:5,name:{id:'Katase Manaka',en:'Katase Manaka',jp:'片瀬真花'},img:'assets/members/Katase_Manaka.jpeg'},
 {id:6,name:{id:'Kato Shu',en:'Kato Shu',jp:'加藤柊'},img:'assets/members/Kato_Shu.jpeg'},
 {id:7,name:{id:'Kurosawa Karen',en:'Kurosawa Karen',jp:'黒澤禾恋'},img:'assets/members/Kurosawa_Karen.jpeg'},
 {id:8,name:{id:'Sato Rica',en:'Sato Rica',jp:'佐藤莉華'},img:'assets/members/Sato_Rica.jpeg'},
 {id:9,name:{id:'Suzuno Mio',en:'Suzuno Mio',jp:'鈴野みお'},img:'assets/members/Suzuno_Mio.jpeg'},
 {id:10,name:{id:'Nakamata Miki',en:'Nakamata Miki',jp:'仲俣美希'},img:'assets/members/Nakamata_Miki.jpeg'},
 {id:11,name:{id:'Nagase Mari',en:'Nagase Mari',jp:'永瀬真梨'},img:'assets/members/Nagase_Mari.jpeg'},
 {id:12,name:{id:'Niino Fuka',en:'Niino Fuka',jp:'新野楓果'},img:'assets/members/Niino_Fuka.jpeg'},
 {id:13,name:{id:'Hashimoto Maki',en:'Hashimoto Maki',jp:'橋本真希'},img:'assets/members/Hashimoto_Maki.jpeg'},
 {id:14,name:{id:'Hayama Rico',en:'Hayama Rico',jp:'葉山莉瑚'},img:'assets/members/Hayama_Rico.jpeg'},
 {id:15,name:{id:'Mizuno Noa',en:'Mizuno Noa',jp:'水野乃愛'},img:'assets/members/Mizuno_Noa.jpeg'},
 {id:16,name:{id:'Momose Suzuna',en:'Momose Suzuna',jp:'百瀬紗菜'},img:'assets/members/Momose_Suzuna.jpeg'},
 {id:17,name:{id:'Yoshikawa Umi',en:'Yoshikawa Umi',jp:'吉川海未'},img:'assets/members/Yoshikawa_Umi.jpeg'}
];

const songs=[
 {id:1,title:{id:'ILU',en:'ILU',jp:'ILU'},url:'https://open.spotify.com/track/4mBzfzsfsDkZ0TzmuJEiZ2'},
 {id:2,title:{id:'Boku no Aurora',en:'Boku no Aurora',jp:'僕のオーロラ'},url:'https://open.spotify.com/track/5MQMSgVCzhUruxxAkVzK5H'},
 {id:3,title:{id:'Tsumari',en:'Tsumari',jp:'つまり'},url:'https://open.spotify.com/track/5z0W1shvZp5NGGI25Oniy2'},
 {id:4,title:{id:'3 Second Rule',en:'3 Second Rule',jp:'3秒ルール'},url:'https://open.spotify.com/track/1Cmp9PkwMbcKwJUdJaAee1'},
 {id:5,title:{id:"Ren'ai Henkaku Katsuyou",en:"Ren'ai Henkaku Katsuyou",jp:'恋愛変格活用'},url:'https://open.spotify.com/track/6MOfU2rS6rBBrRwt78gAsm'},
 {id:6,title:{id:'Sukidayo to Docchi ga Sakini Iunoka?',en:'Which One Says I Love You First?',jp:'好きだよとどっちが先に言うのか？'},url:'https://open.spotify.com/track/5Xr6WaDKhUfgULKQLoGvBE'},
 {id:7,title:{id:'Genki Yoho',en:'Genki Forecast',jp:'元気予報'},url:'https://open.spotify.com/track/7jW6T9MCQVgxJJvXyf7K6x'},
 {id:8,title:{id:'Teiten Kansoku',en:'Fixed-point Observation',jp:'定点観測'},url:'https://open.spotify.com/track/0Tu4xsLz3NJdm8imn7uJtr'}
];

let lang='id';

/* ================= UTIL ================= */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function pairwise(l){const r=[];for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++)r.push([l[i],l[j]]);shuffle(r);return r}

/* ================= NAV ================= */
function renderNav(){
 nav.innerHTML=`
 <button onclick="go('home')">${t.home[lang]}</button>
 <button onclick="go('member')">${t.member[lang]}</button>
 <button onclick="go('love')">${t.love[lang]}</button>
 <button onclick="go('song')">${t.song[lang]}</button>`;
}
function go(p){if(p==='home')home();if(p==='member')memberSorter();if(p==='love')love();if(p==='song')songSorter()}

/* ================= HOME ================= */
function home(){
 app.innerHTML=`<section class="text-center">
 <h2 class="text-3xl font-bold mb-4">Rain Tree Fan Tools</h2>
 <p>${t.homeDesc[lang]}</p></section>`;
}

/* ================= LOVE ================= */
function love(){
 app.innerHTML=`
 <div class="max-w-md mx-auto bg-white p-4 rounded-xl shadow">
 <h2 class="text-xl font-bold mb-3 text-center">${t.love[lang]}</h2>
 <input id="yourName" class="border w-full mb-2 p-2 rounded" placeholder="${t.yourName[lang]}">
 <select id="memberSelect" class="border w-full p-2 rounded mb-3">
 ${members.map(m=>`<option value="${m.id}">${m.name[lang]}</option>`).join('')}
 </select>
 <button onclick="doLove()" class="bg-primary text-white w-full py-2 rounded">${t.loveBtn[lang]}</button>
 <div id="loveResult" class="mt-4"></div></div>`;
}

function doLove(){
 const m=members.find(x=>x.id==memberSelect.value);
 const p=Math.floor(Math.random()*51)+50;
 loveResult.innerHTML=`
 <div class="bg-pink-50 p-4 rounded-xl text-center">
 <img src="${m.img}" class="w-32 mx-auto rounded-full mb-2">
 <h3 class="font-bold">${yourName.value||'You'} × ${m.name[lang]}</h3>
 <div class="text-3xl my-2">${'❤️'.repeat(Math.floor(p/10))}</div>
 <div class="text-4xl font-bold text-pink-500">${p}%</div>
 <div class="text-sm opacity-70">${t.percent[lang]}</div></div>`;
}

/* ================= MEMBER SORTER ================= */
let battles=[],bIndex=0,score={};

function memberSorter(){
 battles=pairwise([...members]);score={};members.forEach(m=>score[m.id]=0);bIndex=0;
 app.innerHTML=`
 <h2 class="text-xl font-bold mb-2">${t.member[lang]}</h2>
 <div class="w-full bg-gray-200 h-3 rounded mb-3"><div id="prog" class="bg-primary h-3 rounded"></div></div>
 <div id="battle" class="grid grid-cols-2 gap-4"></div>`;
 nextBattle();
}

function nextBattle(){
 if(bIndex>=battles.length)return showMemberResult();
 const[a,b]=battles[bIndex];
 prog.style.width=Math.floor((bIndex/battles.length)*100)+'%';
 battle.innerHTML=`
 <button onclick="pickMember(${a.id})" class="bg-white rounded-xl shadow p-2">
 <img src="${a.img}" class="rounded mb-2">${a.name[lang]}</button>
 <button onclick="pickMember(${b.id})" class="bg-white rounded-xl shadow p-2">
 <img src="${b.img}" class="rounded mb-2">${b.name[lang]}</button>`;
}
function pickMember(id){score[id]++;bIndex++;nextBattle();}

function showMemberResult(){
 const r=[...members].sort((a,b)=>score[b.id]-score[a.id]);
 app.innerHTML=`
 <div id="resultArea" class="bg-white rounded-xl shadow p-4">
 <h2 class="text-xl font-bold mb-4 text-center">${t.result[lang]}</h2>
 <table class="w-full border-collapse">
 ${r.map((m,i)=>`
 <tr class="${i<3?'bg-yellow-50':''} border-b">
 <td class="p-2 text-center font-bold">${i===0?'👑':''} ${i+1}</td>
 <td class="p-2"><img src="${m.img}" class="w-12 h-12 rounded-full inline mr-2 border-2 ${i===0?'border-yellow-400':'border-primary'}">${m.name[lang]}</td>
 </tr>`).join('')}</table></div>
 <button onclick="downloadResult()" class="mt-4 bg-primary text-white px-4 py-2 rounded mx-auto block">${t.download[lang]}</button>`;
}

function downloadResult(){
 html2canvas(resultArea).then(c=>{
 const a=document.createElement('a');
 a.href=c.toDataURL();a.download='rain-tree-member-sorter.png';a.click();
});
}

/* ================= SONG SORTER ================= */
let songBattles=[],songIndex=0,songScore={};

function songSorter(){
 songBattles=pairwise([...songs]);songScore={};songs.forEach(s=>songScore[s.id]=0);songIndex=0;
 app.innerHTML=`
 <h2 class="text-xl font-bold mb-2">${t.song[lang]}</h2>
 <div class="w-full bg-gray-200 h-3 rounded mb-3"><div id="songProg" class="bg-primary h-3 rounded"></div></div>
 <div id="songBattle"></div>`;
 nextSongBattle();
}

function nextSongBattle(){
 if(songIndex>=songBattles.length)return showSongResult();
 const[a,b]=songBattles[songIndex];
 songProg.style.width=Math.floor((songIndex/songBattles.length)*100)+'%';
 songBattle.innerHTML=`
 <div class="bg-white rounded-xl shadow p-4 text-center">
 <p class="font-bold mb-2">${t.pickSong[lang]}</p>
 <button onclick="pickSong(${a.id})" class="block w-full mb-2 bg-primary/10 rounded p-2">${a.title[lang]}</button>
 <button onclick="pickSong(${b.id})" class="block w-full bg-primary/10 rounded p-2">${b.title[lang]}</button>
 </div>`;
}
function pickSong(id){songScore[id]++;songIndex++;nextSongBattle();}

function showSongResult(){
 const r=[...songs].sort((a,b)=>songScore[b.id]-songScore[a.id]);
 app.innerHTML=`
 <div id="songResultArea" class="bg-white rounded-xl shadow p-4">
 <h2 class="text-xl font-bold mb-4 text-center">${t.result[lang]}</h2>
 <table class="w-full border-collapse">
 ${r.map((s,i)=>`
 <tr class="${i<3?'bg-emerald-50':''} border-b">
 <td class="p-2 text-center font-bold">${i===0?'👑':''} ${i+1}</td>
 <td class="p-2 font-semibold">${s.title[lang]}</td>
 <td class="p-2 text-right"><a href="${s.url}" target="_blank" class="text-primary underline">Spotify</a></td>
 </tr>`).join('')}</table></div>
 <button onclick="downloadSongResult()" class="mt-4 bg-primary text-white px-4 py-2 rounded mx-auto block">${t.download[lang]}</button>`;
}

function downloadSongResult(){
 html2canvas(songResultArea).then(c=>{
 const a=document.createElement('a');
 a.href=c.toDataURL();a.download='rain-tree-song-sorter.png';a.click();
});
}

langSelect.onchange=e=>{lang=e.target.value;renderNav();home();}
renderNav();home();
</script>
</body>
</html>
