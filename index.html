<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rain Tree Fans Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2ec4c6'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-primary/20 to-white min-h-screen text-gray-800">

<header class="bg-primary text-white p-4 flex justify-between items-center">
  <h1 class="font-bold text-lg">Rain Tree Fans Tools</h1>
  <select id="langSelect" class="text-black rounded px-2 py-1">
    <option value="id">Indonesia</option>
    <option value="en">English</option>
    <option value="jp">日本語</option>
  </select>
</header>

<nav class="flex justify-center gap-4 py-3 bg-white shadow">
  <button onclick="go('home')">Home</button>
  <button onclick="go('memberSorter')">Member Sorter</button>
  <button onclick="go('love')">Ramalan Cinta</button>
  <button onclick="go('songSorter')">Song Sorter</button>
</nav>

<main id="app" class="p-4 max-w-5xl mx-auto"></main>

<script>
// ================= DATA =================
const members = [
  {id:1, name:{id:'Asamiya Hinata', en:'Asamiya Hinata', jp:'朝宮日向'}, img:'assets/members/Asamiya_Hinata.jpeg'},
  {id:2, name:{id:'Ayase Kotori', en:'Ayase Kotori', jp:'綾瀬ことり'}, img:'assets/members/Ayase_Kotori.jpeg'},
  {id:3, name:{id:'Ichihara Tsumugi', en:'Ichihara Tsumugi', jp:'市原紬希'}, img:'assets/members/Ichihara_Tsumugi.jpeg'},
  {id:4, name:{id:'Endo Rino', en:'Endo Rino', jp:'遠藤莉乃'}, img:'assets/members/Endo_Rino.jpeg'},
  {id:5, name:{id:'Katase Manaka', en:'Katase Manaka', jp:'片瀬真花'}, img:'assets/members/Katase_Manaka.jpeg'},
  {id:6, name:{id:'Kato Shu', en:'Kato Shu', jp:'加藤柊'}, img:'assets/members/Kato_Shu.jpeg'},
  {id:7, name:{id:'Kurosawa Karen', en:'Kurosawa Karen', jp:'黒澤禾恋'}, img:'assets/members/Kurosawa_Karen.jpeg', inactive:true},
  {id:8, name:{id:'Sato Rica', en:'Sato Rica', jp:'佐藤莉華'}, img:'assets/members/Sato_Rica.jpeg'},
  {id:9, name:{id:'Suzuno Mio', en:'Suzuno Mio', jp:'鈴野みお'}, img:'assets/members/Suzuno_Mio.jpeg'},
  {id:10, name:{id:'Nakamata Miki', en:'Nakamata Miki', jp:'仲俣美希'}, img:'assets/members/Nakamata_Miki.jpeg'},
  {id:11, name:{id:'Nagase Mari', en:'Nagase Mari', jp:'永瀬真梨'}, img:'assets/members/Nagase_Mari.jpeg'},
  {id:12, name:{id:'Niino Fuka', en:'Niino Fuka', jp:'新野楓果'}, img:'assets/members/Niino_Fuka.jpeg'},
  {id:13, name:{id:'Hashimoto Maki', en:'Hashimoto Maki', jp:'橋本真希'}, img:'assets/members/Hashimoto_Maki.jpeg'},
  {id:14, name:{id:'Hayama Rico', en:'Hayama Rico', jp:'葉山莉瑚'}, img:'assets/members/Hayama_Rico.jpeg'},
  {id:15, name:{id:'Mizuno Noa', en:'Mizuno Noa', jp:'水野乃愛'}, img:'assets/members/Mizuno_Noa.jpeg'},
  {id:16, name:{id:'Momose Suzuna', en:'Momose Suzuna', jp:'百瀬紗菜'}, img:'assets/members/Momose_Suzuna.jpeg'},
  {id:17, name:{id:'Yoshikawa Umi', en:'Yoshikawa Umi', jp:'吉川海未'}, img:'assets/members/Yoshikawa_Umi.jpeg'}
];

const songs = [
  {title:'ILU', url:'https://open.spotify.com/embed/track/4mBzfzsfsDkZ0TzmuJEiZ2'},
  {title:'Boku no Aurora', url:'https://open.spotify.com/embed/track/5MQMSgVCzhUruxxAkVzK5H'},
  {title:'Tsumari', url:'https://open.spotify.com/embed/track/5z0W1shvZp5NGGI25Oniy2'},
  {title:'3 Second Rule', url:'https://open.spotify.com/embed/track/1Cmp9PkwMbcKwJUdJaAee1'},
  {title:'Ren\'ai Henkaku Katsuyou', url:'https://open.spotify.com/embed/track/6MOfU2rS6rBBrRwt78gAsm'},
  {title:'Sukidayo to Docchi ga Sakini Iunoka?', url:'https://open.spotify.com/embed/track/5Xr6WaDKhUfgULKQLoGvBE'},
  {title:'Genki Yoho', url:'https://open.spotify.com/embed/track/7jW6T9MCQVgxJJvXyf7K6x'},
  {title:'Teiten Kansoku', url:'https://open.spotify.com/embed/track/0Tu4xsLz3NJdm8imn7uJtr'}
];

let lang = 'id';

// ================= ROUTER =================
function go(page){
  if(page==='home') home();
  if(page==='memberSorter') memberSorter();
  if(page==='love') love();
  if(page==='songSorter') songSorter();
}

// ================= HOME =================
function home(){
  app.innerHTML = `
    <section class="text-center">
      <h2 class="text-3xl font-bold mb-4">Rain Tree Fan Tools</h2>
      <p class="max-w-xl mx-auto">Fun tools untuk fans Rain Tree 💎<br>Sorter member, ramalan cinta, dan ranking lagu!</p>
    </section>`;
}

// ================= LOVE =================
function love(){
  app.innerHTML = `
    <div class="max-w-md mx-auto bg-white p-4 rounded-xl shadow-lg">
      <h2 class="text-xl font-bold mb-3 text-center">💖 Ramalan Cinta</h2>
      <input id="yourName" placeholder="Namamu" class="border w-full mb-2 p-2 rounded" />
      <select id="memberSelect" class="border w-full p-2 rounded mb-3">
        ${members.map(m=>`<option value="${m.id}">${m.name[lang]}</option>`).join('')}
      </select>
      <button onclick="doLove()" class="bg-primary text-white px-4 py-2 rounded w-full font-semibold">Lihat Hasil</button>
      <div id="loveResult" class="mt-4"></div>
    </div>`;
}

function doLove(){
  const name = document.getElementById('yourName').value || 'Kamu';
  const member = members.find(m=>m.id==memberSelect.value);
  const percent = Math.floor(Math.random()*51)+50;
  const hearts = Math.floor(percent/10);
  const msg = [
    'Chemistry kalian kuat dan bikin deg-degan 💓',
    'Hubungan ini punya potensi berkembang indah ✨',
    'Perasaan kalian selaras tanpa disadari 🌸'
  ][Math.floor(Math.random()*3)];

  loveResult.innerHTML = `
    <div class="bg-pink-50 p-4 rounded-xl text-center shadow">
      <h3 class="font-bold mb-1">${name} × ${member.name[lang]}</h3>
      <div class="text-3xl my-2">${'❤️'.repeat(hearts)}</div>
      <div class="text-4xl font-extrabold text-pink-500">${percent}%</div>
      <p class="mt-2">${msg}</p>
    </div>`;
}

// ================= MEMBER SORTER =================
let battleList = [], results = {}, index = 0;

function memberSorter(){
  battleList = members.filter(m=>true);
  results = {};
  battleList.forEach(m=>results[m.id]=0);
  shuffle(battleList);
  index = 0;

  app.innerHTML = `
    <h2 class="text-xl font-bold mb-3">Member Sorter</h2>
    <div id="battle" class="grid grid-cols-2 gap-4"></div>`;

  nextBattle();
}

function nextBattle(){
  if(index >= battleList.length-1) return showResult();
  const a = battleList[index];
  const b = battleList[index+1];

  battle.innerHTML = `
    <button onclick="pick(${a.id})" class="bg-white rounded shadow p-2">
      <img src="${a.img}" class="w-full rounded mb-2" />
      <div class="text-center font-semibold">${a.name[lang]}</div>
    </button>
    <button onclick="pick(${b.id})" class="bg-white rounded shadow p-2">
      <img src="${b.img}" class="w-full rounded mb-2" />
      <div class="text-center font-semibold">${b.name[lang]}</div>
    </button>`;
}

function pick(id){ results[id]++; index++; nextBattle(); }

function showResult(){
  const ranking = battleList.sort((a,b)=>results[b.id]-results[a.id]);
  app.innerHTML = `
    <h2 class="text-xl font-bold mb-4">Hasil Member Sorter</h2>
    <table class="w-full">
      ${ranking.map((m,i)=>`<tr><td class="p-2">${i+1}</td><td>${m.name[lang]}</td></tr>`).join('')}
    </table>`;
}

// ================= SONG SORTER =================
let songIndex = 0, songScore = {};

function songSorter(){
  songIndex = 0;
  songScore = {};
  songs.forEach(s=>songScore[s.title]=0);
  shuffle(songs);

  app.innerHTML = `
    <h2 class="text-xl font-bold mb-3">Song Sorter</h2>
    <div id="songBattle"></div>`;

  nextSong();
}

function nextSong(){
  if(songIndex >= songs.length-1) return showSongResult();
  const a = songs[songIndex];
  const b = songs[songIndex+1];

  songBattle.innerHTML = `
    <button onclick="pickSong('${a.title}')"><iframe src="${a.url}" width="100%" height="80"></iframe></button>
    <div class="text-center my-2">VS</div>
    <button onclick="pickSong('${b.title}')"><iframe src="${b.url}" width="100%" height="80"></iframe></button>`;
}

function pickSong(title){ songScore[title]++; songIndex++; nextSong(); }

function showSongResult(){
  const ranking = songs.sort((a,b)=>songScore[b.title]-songScore[a.title]);
  app.innerHTML = `
    <h2 class="text-xl font-bold mb-4">Hasil Song Sorter</h2>
    <ol class="list-decimal pl-5">
      ${ranking.map(s=>`<li>${s.title}</li>`).join('')}
    </ol>`;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

langSelect.onchange = e => { lang = e.target.value; home(); }
home();
</script>
</body>
</html>
